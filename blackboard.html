<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokemon-5G｜網址黑板</title><style>body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(#a9e4ff,#e4f7dc);color:#304b5b}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.head h1{margin:0;color:#315f79}.back{background:#fff;padding:10px 14px;border-radius:12px;text-decoration:none;color:#286d9d;font-weight:900}.board{background:#315c43;border:14px solid #8b5b2e;border-radius:18px;box-shadow:0 15px 30px #0003;padding:28px;color:#fff9e8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.box{background:#ffffff12;border:2px solid #ffffff33;border-radius:12px;padding:16px}.label{font-size:12px;opacity:.75;font-weight:900}.value{font-size:25px;font-weight:950;margin-top:8px;line-height:1.45}.value b{font-size:18px}input,textarea{width:100%;box-sizing:border-box;margin-top:8px;border:0;border-radius:10px;padding:12px;font:inherit;background:#fff;color:#304b5b}textarea{min-height:180px;resize:vertical}.mission{margin-top:14px}.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:11px 16px;font-weight:900;cursor:pointer;background:#ffe47b;color:#5b4b17}.hint{margin-top:12px;color:#587181;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h1>📋 Classroom Blackboard｜網址黑板</h1><a class="back" href="./pet-mode-v2.html">🥚 回到班級寵物蛋</a></div><div class="board"><div class="grid"><div class="box"><div class="label">DATE</div><div class="value" id="date"></div></div><div class="box"><div class="label">WEATHER</div><input id="weather" value="☀️"></div><div class="box"><div class="label">CLASSROOM JOB</div><input id="job" placeholder="值日生"></div></div><div class="box mission"><div class="label">TODAY'S MISSION</div><textarea id="mission" placeholder="輸入今天要寫在黑板上的內容"></textarea></div><div class="actions"><button onclick="saveBoard()">💾 儲存黑板</button><button onclick="clearBoard()">🧹 清除內容</button></div></div><div class="hint">固定網址：/Pokemon-5G/blackboard.html　日期會依目前日期自動更新，黑板內容保存在此瀏覽器。</div></div><script>const key="pk5g_blackboard";function today(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0"),week=d.toLocaleDateString("zh-TW",{weekday:"long"});date.innerHTML=y+"/"+m+"/"+day+"<br><b>"+week+"</b>"}function load(){today();try{const x=JSON.parse(localStorage.getItem(key)||"{}");weather.value=x.weather||"☀️";job.value=x.job||"";mission.value=x.mission||""}catch(e){}}function saveBoard(){localStorage.setItem(key,JSON.stringify({weather:weather.value,job:job.value,mission:mission.value}));today();alert("黑板已儲存")}function clearBoard(){weather.value="☀️";job.value="";mission.value="";localStorage.removeItem(key);today()}load();setInterval(today,60000)</script></body></html>
