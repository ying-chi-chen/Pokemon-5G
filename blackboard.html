<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5G 班級寶物｜黑板</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#b7e3a0,#eaf6d7);color:#173f5e}main{max-width:1100px;margin:30px auto;padding:25px}.board{background:#28583d;color:#fff8d8;border:16px solid #b77a3c;border-radius:18px;padding:30px;box-shadow:0 12px 30px #31523a55}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.date{font-size:30px;font-weight:1000}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:25px}.box{background:#ffffff18;border:2px solid #ffffff55;border-radius:14px;padding:18px}.label{font-size:14px;opacity:.8}.value,input,textarea{font:inherit}.value{font-size:27px;font-weight:900}input,textarea{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:0}.actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}button,a{border:0;border-radius:12px;padding:11px 17px;font-weight:900;text-decoration:none;cursor:pointer}button{background:#ffe07a;color:#21476b}a{background:#fff;color:#21476b}@media(max-width:700px){.grid{grid-template-columns:1fr}.date{font-size:23px}}</style></head><body><main><div class="board"><div class="top"><div><div style="font-size:42px;font-weight:1000">📋 CLASSROOM BLACKBOARD</div><div>5G 班級寶物｜每日黑板</div></div><div class="date" id="date"></div></div><div class="grid"><div class="box"><div class="label">WEATHER</div><input id="weather" placeholder="☀️ 晴天"></div><div class="box"><div class="label">CLASSROOM JOB</div><input id="job" placeholder="值日生"></div><div class="box" style="grid-column:1/-1"><div class="label">TODAY'S MISSION</div><textarea id="mission" rows="6" placeholder="輸入今天的班級事項、提醒或任務…"></textarea></div></div><div class="actions"><button onclick="save()">💾 儲存黑板</button><a href="pet-mode.html">🥚 回到班級寵物</a></div></div></main><script>const d=new Date();document.getElementById("date").textContent=d.toLocaleDateString("zh-TW",{year:"numeric",month:"2-digit",day:"2-digit",weekday:"long"});const key="pokemon5g-blackboard";try{const x=JSON.parse(localStorage.getItem(key)||"{}");weather.value=x.weather||"";job.value=x.job||"";mission.value=x.mission||""}catch(e){}function save(){localStorage.setItem(key,JSON.stringify({weather:weather.value,job:job.value,mission:mission.value}));alert("黑板已儲存")}</script></body></html>
