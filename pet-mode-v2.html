<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5G 班級寶物｜班級寵物</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#173f63;background:#dff4d7;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:linear-gradient(#a9ddf5 0 20%,#d9f3c9 20% 72%,#b9df9e 72%);}.sky:before,.sky:after{content:"";position:fixed;z-index:-2;border-radius:50%;filter:blur(1px)}.sky:before{width:170px;height:170px;left:-35px;top:10px;background:#74ad62;box-shadow:90px 18px 0 #6fa95d,1380px 10px 0 #72aa5f,1460px 80px 0 #659d55}.sky:after{width:110px;height:110px;right:20px;top:55px;background:#85bb6a;box-shadow:-110px 35px 0 #6fa65a}
.wrap{max-width:1540px;margin:auto;min-height:100vh}.top{height:124px;padding:17px 28px 10px;display:grid;grid-template-columns:390px 1fr 360px;gap:18px;align-items:center}.logo{height:92px;background:linear-gradient(#fff8d6,#f2d69a);border:7px solid #8b5b2d;border-radius:13px;box-shadow:0 8px 0 #70461f,0 14px 22px #234d2d55;display:flex;align-items:center;padding:0 25px;font-size:47px;font-weight:1000;color:#173f72;text-shadow:3px 3px #fff}.logo span{font-size:70px;margin-right:12px}.motto{height:70px;background:#fffaf0d9;border-radius:16px;border:2px solid #d5b875;padding:16px 22px;font-size:19px;font-weight:900;text-align:center;color:#245486;box-shadow:0 5px 15px #0002}.summary{display:flex;gap:12px;align-items:stretch}.score{background:#fffdf4;border:3px solid #d6b15c;border-radius:14px;padding:9px 18px;text-align:center;min-width:180px;box-shadow:0 6px 12px #0002}.score b{display:block;font-size:15px}.score strong{font-size:27px}.date{background:#eacb93;border:5px solid #8a5a2b;border-radius:12px;padding:10px 16px;text-align:center;font-weight:900;color:#70451e}.date b{font-size:20px;display:block}
.layout{display:grid;grid-template-columns:155px 1fr;gap:0}.side{padding:8px 8px 30px;background:#eef9f2dd;border-radius:0 20px 20px 0;box-shadow:5px 0 18px #285d4b22;min-height:900px}.side a{display:block;padding:15px 8px;margin-bottom:7px;border-radius:13px;text-decoration:none;color:#164c84;font-weight:1000;font-size:18px;text-align:center}.side a.active{background:#ffe06b;box-shadow:0 4px 0 #d1a92e}.wood{margin-top:300px;background:#a96f35;color:#fff5d5;border:5px solid #75471f;border-radius:10px;padding:14px 6px;text-align:center;font-weight:900;line-height:1.45}.main{padding:10px 15px 35px;position:relative}.grid{display:grid;grid-template-columns:repeat(6,minmax(160px,1fr));gap:4px}.card{min-height:210px;background:#fffdf5ee;border:2px solid #d8bc79;border-radius:14px;padding:8px 9px 9px;box-shadow:0 4px 8px #315c3925;position:relative;overflow:visible}.card:nth-child(6n+1){background:linear-gradient(#fffdf8,#fff3ee)}.card:nth-child(6n+2){background:linear-gradient(#fbffff,#eaf9ff)}.card:nth-child(6n+3){background:linear-gradient(#fcfff8,#edfae6)}.card:nth-child(6n+4){background:linear-gradient(#fffef4,#fff7c9)}.card:nth-child(6n+5){background:linear-gradient(#fffdf8,#f8eee0)}.card:nth-child(6n){background:linear-gradient(#fffaff,#f0e7ff)}.card .star{position:absolute;right:8px;top:7px;color:#ffd12e;font-size:22px;text-shadow:0 1px 1px #a36f00}.head{display:flex;gap:7px;align-items:center;padding-right:22px}.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #ff6d6d;color:#d94949;font-weight:1000;font-size:15px;flex:none}.card:nth-child(6n+2) .num{border-color:#2f9bd4;color:#1671a8}.card:nth-child(6n+3) .num{border-color:#66bb68;color:#369342}.card:nth-child(6n+4) .num{border-color:#ffb82e;color:#d27d00}.card:nth-child(6n+5) .num{border-color:#9e7549;color:#76502f}.card:nth-child(6n) .num{border-color:#7659cf;color:#6244b6}.name{font-size:17px;font-weight:1000;white-space:nowrap}.en{font-size:13px;font-weight:800;color:#52728d;margin-left:4px}.team{font-size:11px;font-weight:900;margin-top:1px}.pet{height:112px;display:grid;place-items:center;position:relative}.pet:after{content:"";position:absolute;bottom:4px;width:100px;height:12px;border-radius:50%;background:#8ac27a44;filter:blur(3px)}.pet img{width:112px;height:112px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 5px 4px #0003)}.lv{position:absolute;left:8px;bottom:33px;background:#fff;border-radius:12px;padding:3px 8px;font-weight:1000;font-size:14px;z-index:2;box-shadow:0 2px 4px #0002}.progress{height:9px;background:#e9eef0;border-radius:20px;overflow:hidden;margin:7px 36px 0 2px}.fill{height:100%;border-radius:20px;background:#ff8246}.card:nth-child(6n+2) .fill{background:#36a9df}.card:nth-child(6n+3) .fill{background:#56b85f}.card:nth-child(6n+4) .fill{background:#ffca28}.card:nth-child(6n+5) .fill{background:#a87849}.card:nth-child(6n) .fill{background:#8e66d5}.scoreline{font-size:11px;font-weight:900;margin-top:2px;color:#667b87}.controls{position:absolute;right:6px;bottom:6px;display:flex;gap:3px}.ctrl{width:34px;height:34px;border-radius:50%;border:1px solid #d9e1e5;background:#fff;box-shadow:0 3px 7px #0002;font-size:22px;font-weight:900;cursor:pointer}.plus{color:#099a63}.minus{color:#e55a67}.modal{display:none;position:fixed;inset:0;background:#0e355755;z-index:20;align-items:center;justify-content:center}.modal.show{display:flex}.dialog{width:min(420px,92vw);background:#f6fbff;border:3px solid #7cb9df;border-radius:16px;box-shadow:0 18px 50px #173f6366;padding:18px}.dialog h2{margin:0 0 13px;font-size:20px}.reason{display:block;width:100%;text-align:left;margin:7px 0;padding:12px;border:2px solid #a8d4ef;background:#fff;border-radius:11px;font-weight:900;color:#164c84;cursor:pointer}.close{float:right;border:0;background:none;font-size:26px;color:#82a6bb;cursor:pointer}
@media(max-width:1200px){.top{grid-template-columns:320px 1fr}.summary{display:none}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:820px){.top{height:auto;display:block;padding:12px}.logo{font-size:32px;height:70px}.logo span{font-size:45px}.motto{margin-top:10px}.layout{display:block}.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:10px 7px}.card{min-height:200px}.name{font-size:14px}}
</style></head><body><div class="sky"></div><div class="wrap">
<header class="top"><div class="logo"><span>🌿</span>5G 班級寶物</div><div class="motto">每個孩子都閃閃發光，<br>一起成為更好的自己！ ☀️</div><div class="summary"><div class="score">⭐ 班級總分<strong id="total">0 / 720</strong></div><div class="date">2026 / 09 / 28<br><b>星期一</b></div></div></header>
<div class="layout"><aside class="side"><a class="active" href="./pet-mode-v2.html">⌂ 班級總覽</a><a href="./blackboard.html">📋 網址黑板</a><div class="wood">每個孩子<br>都有一顆<br>專屬的班級寶物<br>一起培養成長！</div></aside>
<main class="main"><section class="grid" id="cards"></section></main></div></div>
<div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeModal()">×</button><h2>選擇加分原因（+1 分）</h2><button class="reason" onclick="addPoint('📚 100分交功課')">📚　1. 100分交功課</button><button class="reason" onclick="addPoint('🪑 離開座位歸還椅子')">🪑　2. 離開座位歸還椅子</button><button class="reason" onclick="addPoint('🔔 鐘響就定位')">🔔　3. 鐘響就定位</button><button class="reason" onclick="addPoint('⭐ 老師加分')">⭐　4. 老師加分</button></div></div>
<script>
const names=["劉桀寧","許紹維","謝秉祐","洪晟睿","黃祈詠","陳楷文","陳一禛","趙子慷","紀浩澤","韓東峻","陳昀臻","陳彥欣","董筠筌","蔡佳諭","林宥廷","楊喻婷","黃妍熙","林樺潔","謝晨慧","劉秉橙","温婕瑀","陳奕安","張詠晴","戴夢恩"];
const en=["Benson","Wayne","Bent","Sage","Oscar","Kevin","Ryan","Jason","Noah","Ethan","Lucas","Ian","Cindy","Alice","Olivia","Tina","Viola","Yilia","Ariel","Allen","Serena","Andy","Chloe","Annalisa"];
const teams=[["🔥","橘隊・噴火龍系",6],["💧","淺藍隊・水系",134],["🍃","綠隊・路卡利歐系",448],["⚡","黃隊・皮卡丘系",25],["🤎","褐隊・伊布系",133],["👻","紫隊・耿鬼系",94]];
const levels=[4,5,4,3,4,4,2,4,4,2,3,3,4,3,4,2,4,3,4,2,4,2,3,4];
let data=[];try{data=JSON.parse(localStorage.getItem("pk5g_students")||"[]")}catch(e){}
const saved=Object.fromEntries(data.map(s=>[Number(s.id),s]));
const students=names.map((name,i)=>{let s=saved[i+1]||{};return{id:i+1,name:s.name||name,eng:s.eng||en[i],team:s.teamIndex??(i%6),xp:Number(s.xp??[62,48,70,38,56,66,24,52,40,28,43,49,64,36,58,32,55,44,61,27,57,31,46,63][i])}});
function sprite(id){return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+id+".png"}
function render(){cards.innerHTML=students.map(s=>{let t=teams[s.team],v=Math.min(100,s.xp);return '<article class="card"><span class="star">★</span><div class="head"><div class="num">'+String(s.id).padStart(2,"0")+'</div><div><div class="name">'+s.name+' <span class="en">'+s.eng+'</span></div><div class="team">'+t[0]+' '+t[1]+'</div></div></div><div class="pet"><img loading="lazy" src="'+sprite(t[2])+'" alt="'+t[1]+'"></div><span class="lv">Lv.'+levels[s.id-1]+'</span><div class="progress"><div class="fill" style="width:'+v+'%"></div></div><div class="scoreline">成長值 '+v+'/100</div><div class="controls"><button class="ctrl minus" onclick="minus('+s.id+')">−</button><button class="ctrl plus" onclick="openModal('+s.id+')">＋</button></div></article>'}).join("");document.getElementById("total").textContent=students.reduce((a,s)=>a+s.xp,0)+" / 720"}
let current=0;function openModal(id){current=id;modal.classList.add("show")}function closeModal(){modal.classList.remove("show")}function addPoint(){let s=students.find(x=>x.id===current);if(s){s.xp=Math.min(100,s.xp+1);save();render()}closeModal()}function minus(id){let s=students.find(x=>x.id===id);if(s){s.xp=Math.max(0,s.xp-1);save();render()}}function save(){localStorage.setItem("pk5g_students",JSON.stringify(students))}modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});render();
</script></body></html>
