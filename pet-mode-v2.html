;gap:14px}.card{background:#fffffff5;border:3px solid #d9eef7;border-radius:20px;padding:13px;box-shadow:0 7px 15px #3d6b7b18;position:relative;overflow:hidden}.card:after{content:"✦";position:absolute;right:10px;top:7px;color:#e8b83e}.topline{display:flex;gap:8px;align-items:center;padding-right:15px}.num{width:34px;height:34px;border-radius:50%;background:#eaf6ff;color:#3674a1;display:grid;place-items:center;font-weight:950;font-size:13px}.name{font-weight:950;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team{font-size:11px;font-weight:800;color:#71838e;margin-top:2px}.eggwrap{height:150px;display:grid;place-items:center}.egg{width:92px;height:116px;border-radius:52% 48% 48% 52%/58% 55% 45% 42%;border:5px solid #d7e2e8;box-shadow:inset -9px -8px 0 #0000000b,0 9px 12px #0002;position:relative;transform:rotate(-5deg);display:grid;place-items:center;font-size:30px}.fire{background:linear-gradient(145deg,#ffd1a6,#ff7650);border-color:#f19a69}.water{background:linear-gradient(145deg,#d8f7ff,#59c1e9);border-color:#65b9de}.grass{background:linear-gradient(145deg,#e1f9da,#74ca8b);border-color:#78c58c}.electric{background:linear-gradient(145deg,#fff7ad,#ffd43d);border-color:#e7c34d}.brown{background:linear-gradient(145deg,#f6e1bd,#c9915f);border-color:#c69765}.ghost{background:linear-gradient(145deg,#e7ccff,#9c73d8);border-color:#a57bd0}.status{font-size:12px;font-weight:900;color:#657986}.bar{height:10px;background:#e8eff2;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#75cc8d,#43afe0);border-radius:99px}.score{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;font-weight:900;color:#72838c}@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.nav{display:none}.layout{grid-template-columns:165px 1fr}}@media(max-width:760px){.layout{display:block}.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:18px 12px}.hero{align-items:start;fl </style></head><body><header class="top"><div class="brand"><span class="ball">◓</span>Pokemon-5G<small>CLASSROOM HUB</small></div><nav class="nav"><a href="./pet-mode-v2.html" class="active">🥚 班級寵物蛋</a><a href="./blackboard.html">📋 網址黑板</a></nav><div class="datebox">今日成長<br><b id="growth">0 / 24</b></div></header><div class="layout"><aside class="side"><a class="active" href="./pet-mode-v2.html">🥚 班級寵物蛋</a><a href="./blackboard.html">📋 網址黑板</a><div class="sign">每個孩子<br>都有一顆<br>自己的寵物蛋<br>一起培養<br>成為更棒的自己！</div><div class="mascot">🦊🥚</div></aside><main class="main"><div class="hero"><div><h1>🥚 班級寵物蛋</h1><p>每個孩子都有一顆自己的寵物蛋　🍃</p></div><a class="blackboard-link" href="./blackboard.html">📋 開啟網址黑板</a></div><section id="cards" class="grid"></section></main></div><script>
const defaultNames=["劉桀寧","許紹維","謝秉祐","洪晟睿","黃祈詠","陳楷文","陳一禎","趙子慷","紀浩澤","韓東峻","陳昀臻","陳彥欣","","","","楊芃羭","","","謝晨蕙","","温婕瑀","","",""];
const teams=[{id:"orange",zh:"橘隊・噴火龍系",cls:"fire",icon:"🔥"},{id:"water",zh:"淺藍隊・水系",cls:"water",icon:"💧"},{id:"green",zh:"綠隊・路卡利歐系",cls:"grass",icon:"🥋"},{id:"yellow",zh:"黃隊・皮卡丘系",cls:"electric",icon:"⚡"},{id:"brown",zh:"褐隊・伊布系",cls:"brown",icon:"🤎"},{id:"purple",zh:"紫隊・耿鬼系",cls:"ghost",icon:"👻"}];
let saved=[];try{saved=JSON.parse(localStorage.getItem("pk5g_students")||"[]")}catch(e){}const old=Object.fromEntries(saved.map(s=>[Number(s.id),s]));
const students=Array.from({length:24},(_,i)=>{const s=old[i+1]||{};return{id:i+1,name:s.name||defaultNames[i]||"同學",team:s.team||teams[i%6].id,xp:Number(s.xp||0)}});
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function render(){cards.innerHTML=students.map(s=>{const t=teams.find(x=>x.id===s.team)||teams[0],v=Math.max(0,Math.min(100,s.xp));return '<article class="card"><div class="topline"><div class="num">'+String(s.id).padStart(2,"0")+'</div><div><div class="name">'+esc(s.name)+'</div><div class="team">'+t.icon+' '+t.zh+'</div></div></div><div class="eggwrap"><div class="egg '+t.cls+'">'+t.icon+'</div></div><div class="status">Lv.1　孵化中</div><div class="bar"><div class="fill" style="width:'+v+'%"></div></div><div class="score"><span>成長值</span><span>'+v+'/100</span></div></article>'}).join("");growth.textContent=students.filter(s=>s.xp>0).length+" / 24"}render();
</script></body></html>
