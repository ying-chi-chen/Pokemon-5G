<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokemon-5G｜班級寵物蛋</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#123d66;background:linear-gradient(#7bd4f1 0,#dff6ed 42%,#c6e7ad);min-height:100vh}
header{height:78px;background:linear-gradient(90deg,#0871bf,#218fe0);display:flex;align-items:center;padding:0 24px;color:#fff;gap:12px;box-shadow:0 4px 12px #24506b55;position:sticky;top:0;z-index:10}.ball{font-size:38px}.brand{font-size:25px;font-weight:1000;line-height:1}.sub{font-size:12px;margin-top:4px}nav{display:flex;gap:10px;margin-left:26px}nav a{background:#fff;color:#17466c;text-decoration:none;font-weight:900;border-radius:18px;padding:12px 19px;white-space:nowrap}nav a.active{background:#ffe070}
main{max-width:1600px;margin:auto;padding:18px 18px 40px}.hero{display:flex;justify-content:space-between;align-items:center;background:#ffffffd9;border:3px solid #fff;border-radius:26px;padding:14px 25px;margin-bottom:10px;box-shadow:0 8px 25px #3b718a22}h1{margin:0;font-size:42px;color:#124e83;letter-spacing:1px}.tag{font-weight:900;font-size:17px;color:#4d8355}.count{background:#fff0bd;border-radius:18px;padding:9px 26px;text-align:center;font-weight:900}.count b{display:block;font-size:29px}
.layout{display:grid;grid-template-columns:180px 1fr;gap:12px}.side{background:#ffffffdf;border-radius:22px;padding:12px 8px;box-shadow:0 7px 18px #31576b20;height:max-content}.side a{display:block;padding:14px 12px;border-radius:15px;text-decoration:none;color:#174c7d;font-size:18px;font-weight:900;margin-bottom:5px}.side a.active{background:#ffe273}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.card{background:#fffffff1;border:3px solid var(--team);border-radius:19px;padding:8px 9px 9px;box-shadow:0 5px 13px #31576b20;min-width:0}.top{display:flex;gap:7px;align-items:center}.no{width:35px;height:35px;flex:none;border-radius:50%;background:#edf4fa;display:grid;place-items:center;font-size:16px;font-weight:1000}.name{font-size:17px;font-weight:1000;white-space:nowrap}.team{font-size:11px;font-weight:900;color:var(--team);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eggwrap{height:132px;display:grid;place-items:center;position:relative}.egg{width:82px;height:104px;border-radius:52% 52% 48% 48%;background:radial-gradient(circle at 34% 24%,#fff 0 7%,transparent 8%),var(--egg);border:5px solid #ffffffd0;box-shadow:inset -8px -9px 0 #0000000c,0 6px 0 #00000012;position:relative}.egg:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;left:13px;top:34px;background:#ffffff88}.egg:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;right:14px;bottom:25px;background:#ffffff88}.spark{position:absolute;color:#ffd13a;font-size:23px}.s1{left:20%;top:20%}.s2{right:17%;bottom:18%}.bottom{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:1000;color:var(--team)}.bar{height:10px;background:#e6ecef;border-radius:99px;overflow:hidden;margin-top:3px}.fill{height:100%;background:var(--team);width:0;border-radius:99px}
.note{margin-top:10px;background:#fff9dfdc;border:2px solid #c7a158;border-radius:15px;padding:10px;font-weight:900}
@media(max-width:1250px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:900px){nav{display:none}.layout{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}.hero{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
<body>
<header><div class="ball">🔴⚪</div><div><div class="brand">Pokemon-5G</div><div class="sub">Classroom Hub</div></div><nav><a href="index.html">🏠 班級首頁</a><a class="active" href="pet-mode.html">🥚 班級寵物蛋</a><a href="#">📋 今日任務</a><a href="pet-evolution.html">📖 五階進化</a><a href="#">🏆 班級排行</a></nav></header>
<main><section class="hero"><div><h1>🥚 班級寵物蛋</h1><div class="tag">每個孩子都有一顆自己的寵物蛋 🌱</div></div><div class="count">今日成長<b id="total">0 / 24</b></div></section>
<div class="layout"><aside class="side"><a href="index.html">👥 班級總覽</a><a class="active" href="pet-mode.html">🥚 寵物蛋</a><a href="#">📋 今日任務</a><a href="pet-evolution.html">📖 五階進化</a><a href="#">🏆 班級排行</a></aside><section><div class="grid" id="grid"></div><div class="note">🌟 五階進化：20／40／60／80／100 成長值依序解鎖 Lv.1～Lv.5。請到「五階進化」查看六條進化線。</div></section></div></main>
<script>
const s=[
["劉桀寧","🔥 橘隊・噴火龍系","#ff9b67","#ff604f"],["許紹維","💧 淺藍隊・水系","#7bd8ee","#238ed8"],["謝秉祐","🌿 綠隊・路卡利歐系","#86d99c","#45a94e"],["洪晟睿","⚡ 黃隊・皮卡丘系","#ffd957","#f1ad18"],["黃祈詠","🤎 褐隊・伊布系","#d1a06a","#a56d32"],["陳楷文","👻 紫隊・耿鬼系","#b794ea","#7650c9"],["陳一禛","👻 紫隊・耿鬼系","#b794ea","#7650c9"],["趙子慷","⚡ 黃隊・皮卡丘系","#ffd957","#f1ad18"],["紀浩澤","💧 淺藍隊・水系","#7bd8ee","#238ed8"],["韓東峻","🔥 橘隊・噴火龍系","#ff9b67","#ff604f"],["陳昀臻","🤎 褐隊・伊布系","#d1a06a","#a56d32"],["陳彥欣","🔥 橘隊・噴火龍系","#ff9b67","#ff604f"],["董宥岑","⚡ 黃隊・皮卡丘系","#ffd957","#f1ad18"],["蔡佳諭","🤎 褐隊・伊布系","#d1a06a","#a56d32"],["楊芃羭","👻 紫隊・耿鬼系","#b794ea","#7650c9"],["楊喻婷","🔥 橘隊・噴火龍系","#ff9b67","#ff604f"],["黃妍熙","⚡ 黃隊・皮卡丘系","#ffd957","#f1ad18"],["林侑潔","🌿 綠隊・路卡利歐系","#86d99c","#45a94e"],["謝晨蕙","🤎 褐隊・伊布系","#d1a06a","#a56d32"],["劉以璇","💧 淺藍隊・水系","#7bd8ee","#238ed8"],["温婕瑀","🌿 綠隊・路卡利歐系","#86d99c","#45a94e"],["陳玫霏","🌿 綠隊・路卡利歐系","#86d99c","#45a94e"],["簡辰芸","💧 淺藍隊・水系","#7bd8ee","#238ed8"],["戴慕恩","👻 紫隊・耿鬼系","#b794ea","#7650c9"]];
let g=JSON.parse(localStorage.getItem("pokemon5g-pet-growth")||"{}"),grid=document.getElementById("grid");
function render(){let total=0;grid.innerHTML=s.map((x,i)=>{let n=Math.max(0,Math.min(100,+g[i]||0));total+=n;let lv=Math.min(5,Math.floor(n/20)+1);return '<article class="card" style="--team:'+x[3]+';--egg:'+x[2]+'"><div class="top"><div class="no">'+String(i+1).padStart(2,"0")+'</div><div><div class="name">'+x[0]+'</div><div class="team">'+x[1]+'</div></div></div><div class="eggwrap"><span class="spark s1">✦</span><div class="egg"></div><span class="spark s2">★</span></div><div class="bottom"><span>Lv.'+lv+'　孵化中</span><span>'+n+'/100</span></div><div class="bar"><div class="fill" style="width:'+n+'%"></div></div></article>'}).join("");document.getElementById("total").textContent=(total?total:0)+" / 24"}render();
</script></body></html>
