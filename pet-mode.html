<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokemon-5G｜班級寵物蛋</title>
<style>
:root{--sky:#aee5ff;--blue:#3c91d6;--nav:#f7fbff;--ink:#334155;--green:#7ccf8a;--yellow:#ffd85c}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(#b8e9ff 0 24%,#dff7df 24% 100%);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 12%,#fff9 0 60px,transparent 61px),radial-gradient(circle at 80% 8%,#fff8 0 75px,transparent 76px)}
.top{height:78px;background:linear-gradient(90deg,#328bd0,#67b8eb);color:#fff;display:flex;align-items:center;padding:10px 22px;gap:22px;box-shadow:0 4px 16px #0002;position:sticky;top:0;z-index:10}
.brand{font-weight:900;font-size:21px;min-width:190px}.brand small{display:block;font-size:11px;opacity:.9;letter-spacing:1px}.ball{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;color:#e84b55;margin-right:8px;font-size:22px}
.nav{display:flex;gap:8px;flex:1}.nav a{color:#35506b;text-decoration:none;background:#fffdf8;border:2px solid #ffffffaa;padding:11px 15px;border-radius:15px;font-weight:800;box-shadow:0 3px 7px #0001}.nav a.active{background:#ffe47b}.datebox{background:#fff;color:#476072;border-radius:14px;padding:8px 13px;text-align:center;font-weight:800;white-space:nowrap}.datebox b{font-size:18px}
.layout{display:grid;grid-template-columns:205px 1fr;max-width:1500px;margin:auto;min-height:calc(100vh - 78px)}
.side{background:#f7fbf5e8;padding:18px 13px;border-right:1px solid #ffffffaa}.side a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;text-decoration:none;color:#496173;font-weight:800;margin-bottom:6px}.side a.active{background:#ffe47b;color:#5c4b17}.sign{margin-top:28px;background:#b98145;color:#fff8e8;border:6px solid #8d5b2c;border-radius:12px;padding:16px 10px;text-align:center;font-weight:900;line-height:1.5;box-shadow:0 8px 16px #0002}.mascot{font-size:58px;text-align:center;margin-top:8px}
.main{padding:26px 26px 40px;background:linear-gradient(#ffffff55,#ffffffaa)}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.hero h1{margin:0;font-size:36px;color:#315c79;text-shadow:0 2px #fff;font-weight:950}.hero p{margin:7px 0 0;color:#587181;font-weight:700}.blackboard-link{background:#fff;border:2px solid #9bd4ef;color:#286d9d;padding:10px 14px;border-radius:13px;text-decoration:none;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:14px}.card{background:#fffffff2;border:3px solid #d9eef7;border-radius:20px;padding:13px;box-shadow:0 7px 15px #3d6b7b18;position:relative;overflow:hidden}.card:after{content:"✦";position:absolute;right:11px;top:8px;color:#f1bd48;font-size:18px}.topline{display:flex;align-items:center;gap:8px;padding-right:18px}.num{width:34px;height:34px;border-radius:50%;background:#eaf6ff;color:#3575a3;display:grid;place-items:center;font-weight:950;font-size:13px}.name{font-weight:950;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team{font-size:11px;font-weight:800;color:#6b7d89;margin-top:3px}.eggwrap{height:150px;display:grid;place-items:center;position:relative}.egg{width:92px;height:116px;border-radius:52% 48% 48% 52%/58% 55% 45% 42%;background:linear-gradient(145deg,#fff,#e7f1f7);border:5px solid #d4e1e8;box-shadow:inset -9px -8px 0 #0000000b,0 9px 12px #0002;position:relative;transform:rotate(-5deg)}.egg:before,.egg:after{content:"";position:absolute;border-radius:50%;background:#fff9}.egg:before{width:18px;height:18px;left:18px;top:25px}.egg:after{width:10px;height:10px;right:19px;top:55px}.fire{background:linear-gradient(135deg,#ffd0a2,#ff764d);border-color:#f29a68}.water{background:linear-gradient(135deg,#d7f5ff,#56bfe8);border-color:#62b9df}.grass{background:linear-gradient(135deg,#dff9d9,#73ca8a);border-color:#78c58c}.electric{background:linear-gradient(135deg,#fff7ae,#ffd33e);border-color:#e8c34a}.brown{background:linear-gradient(135deg,#f6dfb7,#c98d5b);border-color:#c69765}.ghost{background:linear-gradient(135deg,#e7caff,#9b72d8);border-color:#a47bd1}.pattern{position:absolute;inset:0;font-size:25px;display:grid;place-items:center;color:#fff9;text-shadow:0 1px 3px #0002}.status{font-size:12px;font-weight:900;color:#667987}.bar{height:10px;background:#e7eef2;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;width:0;background:linear-gradient(90deg,#70c98a,#42aee1);border-radius:99px}.score{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;font-weight:900;color:#70818d}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.nav{display:none}.layout{grid-template-columns:160px 1fr}}
@media(max-width:760px){.layout{display:block}.side{display:none}.grid{grid-template-columns:repeat(2,1fr)}.main{padding:18px 12px}.hero{align-items:start;flex-direction:column}.hero h1{font-size:28px}.top{height:64px}.datebox{display:none}}
</style>
</head>
<body>
<header class="top">
<div class="brand"><span class="ball">◓</span>Pokemon-5G<small>CLASSROOM HUB</small></div>
<nav class="nav"><a href="./pet-mode.html" class="active">🥚 班級寵物蛋</a><a href="./blackboard.html">📋 網址黑板</a></nav>
<div class="datebox">今日成長<br><b id="growth">0 / 24</b></div>
</header>
<div class="layout">
<aside class="side">
<a class="active" href="./pet-mode.html">🥚 班級寵物蛋</a>
<a href="./blackboard.html">📋 網址黑板</a>
<div class="sign">每個孩子<br>都有一顆<br>自己的寵物蛋<br>一起培養<br>成為更棒的自己！</div>
<div class="mascot">🦊🥚</div>
</aside>
<main class="main">
<div class="hero"><div><h1>🥚 班級寵物蛋</h1><p>每個孩子都有一顆自己的寵物蛋　🍃</p></div><a class="blackboard-link" href="./blackboard.html">📋 開啟網址黑板</a></div>
<section id="cards" class="grid"></section>
</main>
</div>
<script>
const defaultNames=["劉桀寧","許紹維","謝秉祐","洪晟睿","黃祈詠","陳楷文","陳一禎","趙子慷","紀浩澤","韓東峻","陳昀臻","陳彥欣","","","","楊芃羭","","","謝晨蕙","","温婕瑀","","",""];
const teams=[
{id:"orange",zh:"橘隊・噴火龍系",cls:"fire",icon:"🔥"},
{id:"water",zh:"淺藍隊・水系",cls:"water",icon:"💧"},
{id:"green",zh:"綠隊・路卡利歐系",cls:"grass",icon:"🥋"},
{id:"yellow",zh:"黃隊・皮卡丘系",cls:"electric",icon:"⚡"},
{id:"brown",zh:"褐隊・伊布系",cls:"brown",icon:"🤎"},
{id:"purple",zh:"紫隊・耿鬼系",cls:"ghost",icon:"👻"}
];
let saved=[];try{saved=JSON.parse(localStorage.getItem("pk5g_students")||"[]")}catch(e){}
const oldById=Object.fromEntries(saved.map(s=>[Number(s.id),s]));
const students=Array.from({length:24},(_,i)=>{const old=oldById[i+1]||{};return{id:i+1,name:old.name||defaultNames[i]||"同學",team:old.team||teams[i%6].id,xp:Number(old.xp||0)}});

function teamOf(id){return teams.find(t=>t.id===id)||teams[0]}
function render(){document.getElementById("cards").innerHTML=students.map(s=>{const t=teamOf(s.team);const v=Math.max(0,Math.min(100,s.xp));return '<article class="card"><div class="topline"><div class="num">'+String(s.id).padStart(2,"0")+'</div><div><div class="name">'+escapeHtml(s.name)+'</div><div class="team">'+t.icon+' '+t.zh+'</div></div></div><div class="eggwrap"><div class="egg '+t.cls+'"><div class="pattern">'+t.icon+'</div></div></div><div class="status">Lv.1　孵化中</div><div class="bar"><div class="fill" style="width:'+v+'%"></div></div><div class="score"><span>成長值</span><span>'+v+'/100</span></div></article>'}).join("");document.getElementById("growth").textContent=students.filter(s=>s.xp>0).length+" / 24"}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
render();
</script>
</body></html>
