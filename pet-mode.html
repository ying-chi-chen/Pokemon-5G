<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐾 班級寵物</title><style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;margin:0;background:linear-gradient(135deg,#f6f0ff,#eaf8ff);color:#263238}.wrap{max-width:1000px;margin:auto;padding:20px}header{background:#6c63ff;color:#fff;padding:24px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab,button,select{border:0;border-radius:12px;padding:11px 14px;font-size:15px}.tab{background:#fff}.active{background:#6c63ff!important;color:#fff}.panel{display:none}.panel.show{display:block}.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.task{text-align:left;background:#f7f6ff;cursor:pointer}.pet{text-align:center;background:#faf9ff}.emoji{font-size:56px}.plus{color:#16834a}.minus{color:#c0392b}.bar{height:10px;background:#e5e5ee;border-radius:9px;overflow:hidden}.fill{height:100%;background:#7b68ee}</style></head><body><header><div class="wrap"><h1>🐾 班級寵物</h1><div>Pokemon 5-G Classroom Hub</div></div></header><main class="wrap"><div class="tabs"><button class="tab active" onclick="tab('tasks',this)">🎯 每日任務</button><button class="tab" onclick="tab('pets',this)">🥚 寵物圖鑑</button><button class="tab" onclick="tab('logs',this)">📋 今日紀錄</button></div><section id="tasks" class="panel show"><div class="card"><h2>選擇學生</h2><select id="student"><option value="">請選擇座號</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option></select></div><div class="card"><h2>🌟 加分任務</h2><div class="grid"><button class="task" onclick="add('作業完成繳交',1)">📚 <b class="plus">作業完成繳交 ＋1</b></button><button class="task" onclick="add('整理桌面、椅子靠上',1)">🪑 <b class="plus">整理桌面、椅子靠上 ＋1</b></button><button class="task" onclick="add('說英文',1)">🇬🇧 <b class="plus">說英文 ＋1</b></button><button class="task" onclick="add('幫助同學',1)">🤝 <b class="plus">幫助同學 ＋1</b></button></div></div><div class="card"><h2>⚠️ 扣分任務</h2><div class="grid"><button class="task" onclick="add('沒靠椅子',-1)">🪑 <b class="minus">沒靠椅子 −1</b></button><button class="task" onclick="add('上課遲到',-1)">⏰ <b class="minus">上課遲到 −1</b></button><button class="task" onclick="add('提醒 3 次',-1)">🔔 <b class="minus">提醒 3 次 −1</b></button></div></div></section><section id="pets" class="panel"><div class="card"><h2>🥚 六條進化線</h2><div class="grid" id="pets"></div></div></section><section id="logs" class="panel"><div class="card"><h2>📋 今日紀錄</h2><div id="logs"></div></div></section></main><script>const lines=[['皮卡丘線',['🥚','⚡','🐹','⚡🐭','🌟']],['噴火龍線',['🥚','🔥','🦎','🐲','🐉']],['耿鬼線',['🥚','👻','😈','👻💜','🌑']],['路卡利歐線',['🥚','🐶','🥋','💙','✨']],['伊布線',['🥚','🦊','🦊','✨🦊','🌈']],['水躍鴨線',['🥚','🦆','💧🦆','🌊','💦✨']]];const K='p5g-pets';function data(){return JSON.parse(localStorage.getItem(K)||'{}')}function save(x){localStorage.setItem(K,JSON.stringify(x))}function add(t,n){var s=document.getElementById('student').value;if(!s)return alert('請先選擇學生！');var d=data();if(!d[s])d[s]={points:0,logs:[]};d[s].points=Math.max(0,d[s].points+n);d[s].logs.unshift({t:t,n:n,at:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});save(d);renderLogs();alert('已記錄：座號 '+s+'｜'+t+' '+(n>0?'+1':'-1'))}function renderLogs(){var d=data(),a=[];Object.keys(d).forEach(function(s){(d[s].logs||[]).forEach(function(x){a.push({s:s,t:x.t,n:x.n,at:x.at})})});document.getElementById('logs').innerHTML=a.length?a.map(function(x){return '<p>座號 '+x.s+'｜'+x.t+'｜'+(x.n>0?'+1':'-1')+'｜'+x.at+'</p>'}).join(''):'尚無紀錄'}function tab(id,b){document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('show')});document.getElementById(id).classList.add('show');document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');if(id==='logs')renderLogs()}document.getElementById('pets').innerHTML=lines.map(function(x){return '<div class="card pet"><div class="emoji">'+x[1][0]+'</div><h3>'+x[0]+'</h3><div>Lv.1 → Lv.5</div><div class="bar"><div class="fill" style="width:20%"></div></div></div>'}).join('');renderLogs();</script></body></html>
