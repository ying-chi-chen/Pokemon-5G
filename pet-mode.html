<html lang="zh-Hant">
<head>

<title>🥚 班級寵物蛋｜Pokemon-5G</title>
<style>
:root{--ink:#173c60;--sky:#72cce8;--cream:#fffdf8}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(#8edcf5 0,#dff7ed 42%,#c8e9ae 100%);min-height:100vh}
header{height:78px;background:linear-gradient(90deg,#086fbe,#2d9bea);display:flex;align-items:center;padding:0 24px;color:#fff;box-shadow:0 4px 14px #174a6a55;position:sticky;top:0;z-index:5}.logo{font-size:31px}.brand{font-size:24px;font-weight:900;line-height:1}.sub{font-size:11px;opacity:.9;margin-top:4px}nav{display:flex;gap:10px;margin-left:28px;overflow:auto}nav a{white-space:nowrap;color:#17466c;background:#fff;padding:11px 18px;border-radius:18px;text-decoration:none;font-weight:900}nav a.active{background:#ffe07c}
main{max-width:1580px;margin:auto;padding:20px 20px 45px}.hero{display:flex;align-items:center;justify-content:space-between;background:#ffffffd9;border:3px solid #fff;border-radius:28px;padding:18px 24px;margin-bottom:14px;box-shadow:0 8px 24px #39718a22}h1{margin:0;font-size:38px;color:#155285}.tag{font-size:17px;font-weight:900;color:#4b8454}.count{background:#fff2c7;border-radius:20px;padding:10px 23px;text-align:center;font-weight:900}.count b{display:block;font-size:29px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{background:#fffffff0;border:3px solid var(--team);border-radius:21px;padding:10px;box-shadow:0 7px 16px #31576b22;transition:.15s}.card:hover{transform:translateY(-3px)}.top{display:flex;align-items:center;gap:7px}.no{width:35px;height:35px;border-radius:50%;background:#edf4fa;display:grid;place-items:center;font-size:16px;font-weight:900}.name{font-size:17px;font-weight:900;white-space:nowrap}.team{font-size:11px;font-weight:900;color:var(--team);white-space:nowrap}
.egg-wrap{height:136px;display:grid;place-items:center;position:relative}.egg{width:82px;height:104px;border-radius:52% 52% 48% 48%;background:radial-gradient(circle at 34% 25%,#fff 0 7%,transparent 8%),var(--egg);border:5px solid #ffffffcc;box-shadow:inset -8px -9px 0 #0000000d,0 7px 0 #00000010;position:relative}.egg:before{content:"";position:absolute;width:17px;height:17px;border-radius:50%;left:14px;top:34px;background:#fff8}.egg:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;right:14px;bottom:25px;background:#fff8}.spark{position:absolute;color:#ffd53d;font-size:23px}.s1{left:18%;top:22%}.s2{right:17%;bottom:17%}
.status{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:var(--team)}.bar{height:9px;border-radius:99px;background:#e7edf0;overflow:hidden;margin-top:4px}.fill{height:100%;width:0;background:var(--team);border-radius:99px}.btns{display:flex;gap:5px;margin-top:7px}.btns button{border:0;border-radius:9px;padding:6px 7px;font-weight:900;cursor:pointer}.plus{background:#dff7e5;color:#24713b}.minus{background:#ffe4e4;color:#a73535}.reset{background:#edf2f7;color:#52697d}.note{margin-top:15px;background:#fffdf0d9;border:2px solid #c6a15a;border-radius:17px;padding:12px 16px;font-weight:800}
@media(max-width:1250px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:780px){header{height:auto;flex-wrap:wrap;padding:11px 15px}nav{margin-left:0;width:100%}.grid{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column;align-items:flex-start}h1{font-size:29px}}
</style>
</head>
<body>
<header><div class="logo">🔴⚪</div><div><div class="brand">Pokemon-5G</div><div class="sub">Classroom Hub</div></div><nav><a href="index.html">🏠 班級首頁</a><a class="active" href="pet-mode.html">🥚 班級寵物蛋</a><a href="pet-tasks.html">📋 今日任務</a><a href="#">📖 寵物圖鑑</a><a href="#">🏆 班級排行</a></nav></header>
<main><section class="hero"><div><h1>🥚 班級寵物蛋</h1><div class="tag">每個孩子都有一顆自己的蛋 🌱</div></div><div class="count">今日成長<b id="total">0 / 2400</b></div></section><section class="grid" id="grid"></section><div class="note">🌟 每完成一次班級任務，就能讓自己的寵物蛋累積成長值！達到進化條件後，寵物會一步一步長大。</div></main>
<script>
const students=[
["劉桀寧","🔥 橘隊・噴火龍系","#ff9b67","#ff604f"],["許紹維","💧 淺藍隊・水系","#7bd8ee","#238ed8"],["謝秉祐","🌿 綠隊・路卡利歐系","#86d99c","#45a94e"],["洪晟睿","⚡ 黃隊・皮卡丘系","#ffd957","#f1ad18"],["黃祈詠","🤎 褐隊・伊布系","#d1a06a","#a56d32"],["陳楷文","👻 紫隊・耿鬼系","#b794ea","#7650c9"],["陳一禛","👻 紫隊・耿鬼系","#b794ea","#7650c9"],["趙子慷","⚡ 黃隊・皮卡丘系","#ffd957","#f1ad18"],["紀浩澤","💧 淺藍隊・水系","#7bd8ee","#238ed8"],["韓東峻","🔥 橘隊・噴火龍系","#ff9b67","#ff604f"],["陳昀臻","🤎 褐隊・伊布系","#d1a06a","#a56d32"],["陳彥欣","🔥 橘隊・噴火龍系","#ff9b67","#ff604f"],["董宥岑","⚡ 黃隊・皮卡丘系","#ffd957","#f1ad18"],["蔡佳諭","🤎 褐隊・伊布系","#d1a06a","#a56d32"],["楊芃羭","👻 紫隊・耿鬼系","#b794ea","#7650c9"],["楊喻婷","🔥 橘隊・噴火龍系","#ff9b67","#ff604f"],["黃妍熙","⚡ 黃隊・皮卡丘系","#ffd957","#f1ad18"],["林侑潔","🌿 綠隊・路卡利歐系","#86d99c","#45a94e"],["謝晨蕙","🤎 褐隊・伊布系","#d1a06a","#a56d32"],["劉以璇","💧 淺藍隊・水系","#7bd8ee","#238ed8"],["温婕瑀","🌿 綠隊・路卡利歐系","#86d99c","#45a94e"],["陳玫霏","🌿 綠隊・路卡利歐系","#86d99c","#45a94e"],["簡辰芸","💧 淺藍隊・水系","#7bd8ee","#238ed8"],["戴慕恩","👻 紫隊・耿鬼系","#b794ea","#7650c9"]];
const key="pokemon5g-pet-growth";let growth=JSON.parse(localStorage.getItem(key)||"{}");
const grid=document.getElementById("grid");
function render(){grid.innerHTML="";let total=0;students.forEach((s,i)=>{let n=+growth[i]||0;total+=n;let lv=Math.min(5,Math.floor(n/20)+1);let pct=Math.min(100,n);let c=document.createElement("article");c.className="card";c.style.setProperty("--team",s[3]);c.style.setProperty("--egg",s[2]);c.innerHTML='<div class="top"><div class="no">'+String(i+1).padStart(2,"0")+'</div><div><div class="name">'+s[0]+'</div><div class="team">'+s[1]+'</div></div></div><div class="egg-wrap"><span class="spark s1">✦</span><div class="egg"></div><span class="spark s2">★</span></div><div class="status"><span>Lv.'+lv+'　'+(lv<5?"孵化／成長中":"進化完成")+'</span><span>'+n+'/100</span></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div><div class="btns"><button class="minus" onclick="change('+i+',-1)">−1</button><button class="plus" onclick="change('+i+',1)">＋1 成長</button><button class="reset" onclick="change('+i+',-999)">重置</button></div></article>';grid.appendChild(c)});document.getElementById("total").textContent=total+" / 2400"}function change(i,d){growth[i]=d===-999?0:Math.max(0,Math.min(100,(+growth[i]||0)+d));localStorage.setItem(key,JSON.stringify(growth));render()}render();
</script></body></html>
