<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon 五己 Classroom Hub｜B畫風角色完整比例最新版</title>
<style>
:root{--bg:#f7f4eb;--ink:#203653;--muted:#6d7b8d;--white:#fff;--blue:#4f9ddd;--shadow:0 8px 24px #20365318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}
header{padding:22px 5%;background:linear-gradient(135deg,#e9f7ff,#fff5d8);border-bottom:4px solid #fff}
h1{margin:0;font-size:clamp(28px,5vw,46px)}h2{margin-top:0}.sub{font-weight:700;color:#53657c;margin-top:6px}
nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;padding:12px 5%;background:#fff;box-shadow:0 3px 14px #0001}
nav button,button,.btn{border:0;border-radius:13px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer;background:#edf4fb;color:var(--ink)}
nav button.active,.primary{background:var(--blue);color:#fff}
main{max-width:1250px;margin:auto;padding:22px 5% 55px}section{display:none}section.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card,.hero{background:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}.hero{margin-bottom:18px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
input,select,textarea{border:2px solid #dce6ef;border-radius:12px;padding:10px;font:inherit;max-width:100%}
input[type=number]{width:90px}.muted{color:var(--muted)}.stat{font-size:32px;font-weight:900}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff0a8;font-weight:800;margin:3px}
.team{border-top:9px solid var(--team);overflow:visible;position:relative}.character{width:100%;height:270px;object-fit:contain;object-position:center center;border-radius:20px;background:linear-gradient(180deg,#ffffff,#f3f9ff);padding:10px;display:block;box-shadow:inset 0 0 0 2px #dfeaf3;overflow:visible}
.team .xp{font-size:28px;font-weight:900}.progress{height:12px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--blue)}
.student{display:flex;align-items:center;gap:10px}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#edf4fb;font-weight:900}
.student-char{width:92px;height:92px;flex:0 0 92px;object-fit:contain;object-position:center;border-radius:18px;background:linear-gradient(180deg,#ffffff,#f3f9ff);padding:6px;box-shadow:inset 0 0 0 2px #dfeaf3}
.big{font-size:64px;font-weight:900;text-align:center;padding:20px}.timer{font-size:80px;text-align:center;font-weight:900}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4}.scroll{overflow:auto}
.mission{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:14px;border-radius:16px;background:#fff;margin-bottom:10px;box-shadow:var(--shadow)}
.notice{padding:12px;border-radius:14px;background:#eef8ff}.small{font-size:13px}.danger{background:#ffe3e3}.success{background:#e4f8e8}
.guide-img{width:100%;display:block;border-radius:18px;box-shadow:var(--shadow);background:#fff}.guide-card{padding:10px;margin-top:16px}
.team-mini{display:flex;align-items:center;gap:10px}.team-mini img{width:64px;height:64px;object-fit:contain;object-position:center;border-radius:14px;padding:3px;background:#f5f9fc;box-shadow:inset 0 0 0 1px #dfeaf3}
footer{text-align:center;color:var(--muted);padding:25px}
@media(max-width:600px){nav{position:static}.timer{font-size:58px}.character{height:220px;padding:8px}.student-char{width:64px;height:64px;flex-basis:64px}}

/* Trainer List｜24 位訓練家專用排版 */
.trainer-list-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:clamp(22px,2.2vw,30px);
  line-height:1.15;
  font-weight:900;
  letter-spacing:.2px;
  margin:0;
}
.trainer-list-title .count{
  font-size:.72em;
  font-weight:800;
  white-space:nowrap;
  padding:6px 12px;
  border-radius:999px;
  background:#eaf4ff;
  color:#214b7a;
  line-height:1;
}
.trainer-list-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.trainer-list-toolbar .filters{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.trainer-list-toolbar input,
.trainer-list-toolbar select{
  height:42px;
  font-size:15px;
  line-height:1;
}
.trainer-list-card{
  text-align:left;
}
.trainer-list-card .student{
  align-items:center;
}
.trainer-list-card .student-name{
  font-size:18px;
  line-height:1.2;
  font-weight:900;
  white-space:nowrap;
}
.trainer-list-card .student-meta{
  font-size:14px;
  line-height:1.25;
}
@media(max-width:600px){
  .trainer-list-title{font-size:21px;gap:8px}
  .trainer-list-title .count{font-size:.68em;padding:5px 9px}
  .trainer-list-toolbar{align-items:stretch}
  .trainer-list-toolbar .filters{width:100%}
  .trainer-list-toolbar input{flex:1;min-width:150px}
  .trainer-list-card .student-name{font-size:16px}
}


/* ===== Trainer List｜Redesign ===== */
.trainer-page{
  background:linear-gradient(180deg,#fffdf8 0%,#f7fbff 100%);
}
.trainer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.trainer-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  font-size:clamp(24px,2.6vw,34px);
  line-height:1.1;
  font-weight:950;
}
.trainer-title .count{
  display:inline-flex;
  align-items:center;
  height:34px;
  padding:0 13px;
  border-radius:999px;
  background:#e9f5ff;
  color:#18538a;
  font-size:15px;
  font-weight:900;
}
.trainer-toolbar{
  display:grid;
  grid-template-columns:minmax(220px,1fr) auto auto;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
}
.trainer-toolbar input,
.trainer-toolbar select{
  width:100%;
  height:44px;
  border-radius:14px;
  background:#fff;
}
.trainer-toolbar button{
  height:44px;
  white-space:nowrap;
}
.trainer-filter-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px;
}
.trainer-filter{
  border:2px solid #e0eaf2;
  background:#fff;
  border-radius:999px;
  padding:7px 12px;
  font-weight:850;
  cursor:pointer;
}
.trainer-filter.active{
  border-color:#5aa9e6;
  background:#eaf6ff;
  color:#17548c;
}
.trainer-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.trainer-item{
  min-width:0;
  background:#fff;
  border:2px solid #e6edf3;
  border-top:7px solid var(--team-color);
  border-radius:20px;
  padding:13px;
  box-shadow:0 7px 18px #24344d12;
  transition:transform .15s ease,box-shadow .15s ease;
}
.trainer-item:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px #24344d18;
}
.trainer-main{
  display:grid;
  grid-template-columns:76px 34px minmax(0,1fr);
  align-items:center;
  gap:9px;
}
.trainer-role{
  width:76px;
  height:76px;
  display:block;
  object-fit:contain;
  object-position:center;
  padding:5px;
  border-radius:16px;
  background:linear-gradient(180deg,#fff,#f3f8fc);
  box-shadow:inset 0 0 0 2px #e2ebf2;
}
.trainer-number{
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:#eef4f9;
  font-size:15px;
  font-weight:950;
}
.trainer-info{min-width:0}
.trainer-name{
  font-size:18px;
  line-height:1.25;
  font-weight:950;
  white-space:nowrap;
  overflow:visible;
  text-overflow:clip;
  letter-spacing:1px;
  min-width:3em;
}
.trainer-team{
  margin-top:4px;
  font-size:13px;
  line-height:1.25;
  font-weight:800;
  color:#536579;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.trainer-level{
  margin-top:6px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:28px;
  padding:4px 9px;
  border-radius:999px;
  background:#fff0a8;
  font-size:12px;
  line-height:1.1;
  font-weight:950;
  white-space:nowrap;
}
.trainer-xp{
  grid-column:3;
  justify-self:start;
  min-width:58px;
  text-align:left;
  font-size:15px;
  line-height:1.1;
  font-weight:950;
  white-space:nowrap;
  margin-top:2px;
}
.trainer-actions{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:7px;
  margin-top:11px;
  padding-top:10px;
  border-top:1px solid #edf1f5;
}
.trainer-actions select{
  min-width:0;
  width:100%;
  height:36px;
  padding:6px 9px;
  font-size:13px;
  border-radius:10px;
}
.trainer-actions button{
  height:36px;
  padding:6px 10px;
  border-radius:10px;
  font-size:13px;
}
.trainer-summary{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:0 0 16px;
}
.trainer-summary .mini{
  background:#fff;
  border:2px solid #e6edf3;
  border-radius:15px;
  padding:8px 12px;
  font-size:14px;
  font-weight:850;
}
@media(max-width:1050px){
  .trainer-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
  .trainer-toolbar{grid-template-columns:1fr 1fr}
  .trainer-toolbar input{grid-column:1/-1}
  .trainer-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .trainer-main{grid-template-columns:64px 30px minmax(0,1fr)}
  .trainer-role{width:64px;height:64px}
  .trainer-name{min-width:3em}
  .trainer-number{width:30px;height:30px;font-size:14px}
  .trainer-xp{grid-column:3;text-align:left;font-size:15px;margin-top:3px}
  .trainer-name{font-size:17px;letter-spacing:.8px;white-space:nowrap;overflow:visible;text-overflow:clip}
}
@media(max-width:520px){
  .trainer-toolbar{grid-template-columns:1fr}
  .trainer-grid{grid-template-columns:1fr}
  .trainer-main{grid-template-columns:72px 34px minmax(0,1fr) auto}
  .trainer-role{width:72px;height:72px}
  .trainer-number{width:34px;height:34px}
  .trainer-xp{grid-column:auto;text-align:right;font-size:16px;margin-top:0}
}


/* === 5G 班級寶物｜明亮校園背景優化（依參考圖風格） === */
html{background:#dff4ff}body{position:relative;min-height:100vh;background:radial-gradient(circle at 88% 9%,rgba(255,226,104,.9) 0 42px,rgba(255,226,104,.22) 43px 78px,transparent 79px),radial-gradient(circle at 8% 12%,rgba(94,178,89,.95) 0 58px,transparent 59px),radial-gradient(circle at 16% 7%,rgba(111,194,103,.9) 0 48px,transparent 49px),radial-gradient(circle at 94% 25%,rgba(83,164,79,.9) 0 62px,transparent 63px),linear-gradient(180deg,#dff4ff 0%,#c9ecff 46%,#b8df9d 47%,#d8efbc 100%);background-attachment:fixed}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.42;background:linear-gradient(90deg,transparent 0 7%,rgba(255,255,255,.55) 7.2% 7.7%,transparent 7.9% 92%,rgba(255,255,255,.5) 92.2% 92.7%,transparent 92.9%),linear-gradient(180deg,transparent 0 61%,rgba(72,135,67,.18) 61.2% 61.8%,transparent 62%)}header{position:relative;overflow:hidden;margin:14px 3% 0;border:3px solid #d39b54;border-bottom-width:5px;border-radius:24px;background:linear-gradient(135deg,#f8dca5,#fff4ce 55%,#e8c27d);box-shadow:0 10px 28px rgba(56,95,69,.18)}header:after{content:"✦  ✿  ✦  🍃  ✦";position:absolute;right:24px;bottom:10px;color:#5b9b5d;font-size:22px;letter-spacing:7px;opacity:.65}nav{margin:10px 3% 0;border:2px solid rgba(255,255,255,.85);border-radius:18px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(48,91,111,.16)}nav button{border:1px solid #dce9f2;box-shadow:0 2px 7px rgba(44,81,103,.08)}nav button.active,.primary{background:linear-gradient(135deg,#5ca8e6,#397ec2)}.teacher-bonus{background:linear-gradient(135deg,#f6b84a,#e68a24)!important;box-shadow:0 4px 12px rgba(230,138,36,.28)}main{padding-top:24px}.hero,.card{border:2px solid rgba(255,255,255,.9);box-shadow:0 10px 26px rgba(51,89,70,.13)}.trainer-card,.trainer-grid .card{box-shadow:0 7px 18px rgba(58,89,70,.14)}
</style>
</head>
